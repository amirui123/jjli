name: Deploy to GitHub Pages

# Builds the real app and publishes it from GitHub's own servers, so the link
# works for anyone without Vercel's deployment protection in the way.
#
# The site is served from https://<owner>.github.io/<repo>/ — hence VITE_BASE.
# Only the app itself is published; the standalone/single-file builds stay in the
# repository (share/) and are never served from the site.

on:
  push:
    branches:
      - arena/66e11543-jjli
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (served from /<repo>/)
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Hash routing — any unknown path boots the app
        run: |
          cp dist/index.html dist/404.html
          ls -lh dist | head -12

      # The workflow token can read Pages but not enable it (that needs repo admin),
      # so this step also checks whether the site exists and explains the one switch
      # a human has to flip. Once it is on, every push deploys by itself.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: GitHub Pages is not enabled yet
        if: steps.pages.outcome != 'success'
        run: |
          echo "::error title=فعال‌سازی GitHub Pages::یک‌بار این تنظیم را روشن کنید — Settings → Pages → Build and deployment → Source: GitHub Actions — سپس این ورک‌فلوی را دوباره اجرا کنید."
          echo "Then re-run this workflow; the site will publish at https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
