# Searches GitHub every day for repos that may belong in the list and keeps
# one open issue with the candidates. Nothing is added to the list
# automatically: a maintainer checks each source and tags it by hand.
name: Discover candidate cases

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Search GitHub and update the candidates issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          since=$(date -u -d '14 days ago' +%Y-%m-%d)
          queries=(
            'rea-agents'
            'morluto/rea'
            '"reverse engineer anything"'
            'REA reverse engineering'
            'reverse engineered claude code'
            'clean-room reimplementation rust'
          )

          # Repos already linked anywhere in the list.
          cat README*.md docs/*.md \
            | grep -oiE 'github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' \
            | sed -E 's#^github\.com/##I; s#\.git$##' | tr 'A-Z' 'a-z' | sort -u > known.txt
          printf '%s\n' morluto/rea "${GITHUB_REPOSITORY,,}" >> known.txt

          : > found.tsv
          for q in "${queries[@]}"; do
            gh search repos "$q" --updated ">=$since" --limit 50 \
              --json fullName,description,stargazersCount,url,isFork \
              --jq '.[] | select(.isFork | not)
                    | [.fullName, (.stargazersCount | tostring), .url,
                       ((.description // "") | gsub("[\t\r\n|]"; " ") | .[0:140])]
                    | @tsv' >> found.tsv || echo "search failed: $q"
            sleep 3
          done

          sort -u -t$'\t' -k1,1 found.tsv \
            | awk -F'\t' 'NR==FNR { known[$1]; next } !(tolower($1) in known)' known.txt - \
            | sort -t$'\t' -k2,2nr | head -n 60 > candidates.tsv

          {
            echo "Repos updated since $since that match REA / AI reverse-engineering searches and are not in the list yet."
            echo
            echo "Generated by \`.github/workflows/discover-candidates.yml\` on $(date -u +%Y-%m-%d). Check each source before adding it, and tag it by what the source says (REA, AI-RE, Rebuild or Claim?). Many results will be unrelated."
            echo
            if [ -s candidates.tsv ]; then
              echo "| Repo | Stars | Description |"
              echo "|---|---:|---|"
              awk -F'\t' '{ printf "| [%s](%s) | %s | %s |\n", $1, $3, $2, $4 }' candidates.tsv
            else
              echo "No new candidates this time."
            fi
          } > body.md

          title="Candidate cases (auto-updated)"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
          echo "$(wc -l < candidates.tsv) candidates"
