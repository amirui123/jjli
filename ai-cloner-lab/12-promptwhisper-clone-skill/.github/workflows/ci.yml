name: CI

on:
  push:
  pull_request:

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: Node and schema tests
        run: npm test
      - name: Python comparator and variance tests
        run: npm run test:python
      - name: Local fixture end-to-end smoke test
        run: npm run test:smoke
      - name: Check required skill and report artifacts
        run: |
          test -f clone-any-website/SKILL.md
          test -f clone-any-website/schemas/clone-run.schema.json
          test -f clone-any-website/scripts/run-verification.mjs
          test -f clone-any-website/scripts/compare-screenshots.py
          test -f clone-any-website/scripts/calibrate-variance.py
