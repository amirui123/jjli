<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%" role="img" aria-label="RTL Motion Lab — System Architecture &amp; 11-Pillar Knowledge Vault">
  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060A" />
      <stop offset="50%" stop-color="#090C15" />
      <stop offset="100%" stop-color="#05060A" />
    </linearGradient>
    <radialGradient id="arch-lapis" cx="25%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="arch-gold" cx="78%" cy="68%" r="50%">
      <stop offset="0%" stop-color="#E8B33A" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#E8B33A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="arch-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8B33A" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.5" />
    </linearGradient>
    <pattern id="grid-dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.06" />
    </pattern>
  </defs>

  <!-- Frame -->
  <rect x="4" y="4" width="1192" height="432" rx="22" fill="url(#arch-bg)" stroke="url(#arch-border)" stroke-width="1.5" />
  <rect x="4" y="4" width="1192" height="432" rx="22" fill="url(#arch-lapis)" />
  <rect x="4" y="4" width="1192" height="432" rx="22" fill="url(#arch-gold)" />
  <rect x="4" y="4" width="1192" height="432" rx="22" fill="url(#grid-dots)" />

  <!-- Header -->
  <text x="42" y="46" fill="#E8B33A" font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="2">
    SYSTEM ARCHITECTURE // 100% CLIENT-SIDE ZERO-BACKEND WORKBENCH
  </text>
  <text x="42" y="76" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="22" font-weight="800">
    Three-Layer Engineering Pipeline: Knowledge Vault → Real-Time Engines → 7 Interactive Studios
  </text>

  <!-- LAYER 1: 11-PILLAR VAULT -->
  <g transform="translate(40, 104)">
    <rect x="0" y="0" width="340" height="296" rx="16" fill="#0B0E18" fill-opacity="0.92" stroke="#1E293B" stroke-width="1.2" />
    <rect x="16" y="16" width="84" height="22" rx="6" fill="#E8B33A" fill-opacity="0.16" />
    <text x="58" y="31" text-anchor="middle" fill="#E8B33A" font-family="monospace" font-size="10.5" font-weight="700">LAYER 01</text>
    <text x="16" y="60" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">11-Pillar Design-Lab Vault</text>
    <text x="16" y="80" fill="#94A3B8" font-family="sans-serif" font-size="12">4,037 indexed files · 49 subcategories · 29.8 MB</text>

    <g transform="translate(16, 98)" font-family="monospace" font-size="11" fill="#CBD5E1">
      <rect x="0" y="0" width="308" height="26" rx="6" fill="#111625" />
      <text x="10" y="17" fill="#E8B33A">00–02</text>
      <text x="62" y="17">UI Systems, Web Motion &amp; Spring Physics</text>

      <rect x="0" y="32" width="308" height="26" rx="6" fill="#111625" />
      <text x="10" y="49" fill="#38BDF8">03–05</text>
      <text x="62" y="49">After Effects, 12 Registries &amp; GLSL Shaders</text>

      <rect x="0" y="64" width="308" height="26" rx="6" fill="#111625" />
      <text x="10" y="81" fill="#34D399">06–07</text>
      <text x="62" y="81">Copywriting Mastery &amp; 60-30-10 Color Psych</text>

      <rect x="0" y="96" width="308" height="26" rx="6" fill="#111625" />
      <text x="10" y="113" fill="#FB7185">08–09</text>
      <text x="62" y="113">Procedural Sonic UX, WASM &amp; React Doctor</text>

      <rect x="0" y="128" width="308" height="26" rx="6" fill="#111625" />
      <text x="10" y="145" fill="#A78BFA">10</text>
      <text x="62" y="145">Math, SDFs, Girih Geometry &amp; Reaction-Diff</text>

      <rect x="0" y="162" width="308" height="24" rx="6" fill="#1E293B" fill-opacity="0.5" />
      <text x="154" y="178" text-anchor="middle" fill="#F8FAFC" font-size="10.5">+ 179 Curated SKILL.md &amp; 84 Brand DESIGN.md</text>
    </g>
  </g>

  <!-- Connector 1 -> 2 -->
  <g stroke="#E8B33A" stroke-width="2" stroke-dasharray="5 5" fill="none">
    <line x1="384" y1="252" x2="426" y2="252" />
  </g>
  <polygon points="426,247 436,252 426,257" fill="#E8B33A" />

  <!-- LAYER 2: REAL-TIME ENGINES -->
  <g transform="translate(440, 104)">
    <rect x="0" y="0" width="320" height="296" rx="16" fill="#0B0E18" fill-opacity="0.92" stroke="#1E293B" stroke-width="1.2" />
    <rect x="16" y="16" width="84" height="22" rx="6" fill="#38BDF8" fill-opacity="0.16" />
    <text x="58" y="31" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="10.5" font-weight="700">LAYER 02</text>
    <text x="16" y="60" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">Zero-Latency Core Engines</text>
    <text x="16" y="80" fill="#94A3B8" font-family="sans-serif" font-size="12">60/120Hz GPU &amp; DSP synthesis in pure TypeScript</text>

    <g transform="translate(16, 98)" font-family="sans-serif" font-size="11.5" fill="#E2E8F0">
      <rect x="0" y="0" width="288" height="34" rx="8" fill="#111625" stroke="#1E293B" />
      <text x="12" y="21" font-weight="600" fill="#F8FAFC">RK4 &amp; Analytical Spring Solver</text>

      <rect x="0" y="42" width="288" height="34" rx="8" fill="#111625" stroke="#1E293B" />
      <text x="12" y="63" font-weight="600" fill="#F8FAFC">Web Audio Procedural Synth + WAV</text>

      <rect x="0" y="84" width="288" height="34" rx="8" fill="#111625" stroke="#1E293B" />
      <text x="12" y="105" font-weight="600" fill="#F8FAFC">WebGL Fragment Lab (Auto-Pause IO)</text>

      <rect x="0" y="126" width="288" height="34" rx="8" fill="#111625" stroke="#1E293B" />
      <text x="12" y="147" font-weight="600" fill="#F8FAFC">20-Rule RTL Auditor &amp; ZWNJ Engine</text>

      <rect x="0" y="168" width="288" height="22" rx="6" fill="#0F172A" />
      <text x="144" y="183" text-anchor="middle" font-family="monospace" font-size="10" fill="#38BDF8">OLED-Safe #05060A · 60-30-10 Color Psych</text>
    </g>
  </g>

  <!-- Connector 2 -> 3 -->
  <g stroke="#38BDF8" stroke-width="2" stroke-dasharray="5 5" fill="none">
    <line x1="764" y1="252" x2="806" y2="252" />
  </g>
  <polygon points="806,247 816,252 806,257" fill="#38BDF8" />

  <!-- LAYER 3: 7 BESPOKE STUDIOS -->
  <g transform="translate(820, 104)">
    <rect x="0" y="0" width="340" height="296" rx="16" fill="#0B0E18" fill-opacity="0.92" stroke="#1E293B" stroke-width="1.2" />
    <rect x="16" y="16" width="84" height="22" rx="6" fill="#A78BFA" fill-opacity="0.16" />
    <text x="58" y="31" text-anchor="middle" fill="#A78BFA" font-family="monospace" font-size="10.5" font-weight="700">LAYER 03</text>
    <text x="16" y="60" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">7 Bespoke Interactive Studios</text>
    <text x="16" y="80" fill="#94A3B8" font-family="sans-serif" font-size="12">3-Rail Desktop Workbench &amp; Touch Mobile Dock</text>

    <g transform="translate(16, 98)" font-family="monospace" font-size="11" fill="#E2E8F0">
      <rect x="0" y="0" width="148" height="38" rx="8" fill="#111625" />
      <text x="10" y="17" fill="#E8B33A" font-weight="700">/studio/skills</text>
      <text x="10" y="31" fill="#94A3B8" font-size="9.5">4,300+ Vault &amp; Prompts</text>

      <rect x="158" y="0" width="148" height="38" rx="8" fill="#111625" />
      <text x="168" y="17" fill="#38BDF8" font-weight="700">/studio/fonts</text>
      <text x="168" y="31" fill="#94A3B8" font-size="9.5">50 Families · 97 Files</text>

      <rect x="0" y="46" width="148" height="38" rx="8" fill="#111625" />
      <text x="10" y="63" fill="#34D399" font-weight="700">/studio/motion</text>
      <text x="10" y="77" fill="#94A3B8" font-size="9.5">Spring &amp; Bezier Solver</text>

      <rect x="158" y="46" width="148" height="38" rx="8" fill="#111625" />
      <text x="168" y="63" fill="#A78BFA" font-weight="700">/studio/components</text>
      <text x="168" y="77" fill="#94A3B8" font-size="9.5">4,199 TSX Sources</text>

      <rect x="0" y="92" width="148" height="38" rx="8" fill="#111625" />
      <text x="10" y="109" fill="#FB7185" font-weight="700">/studio/sounds</text>
      <text x="10" y="123" fill="#94A3B8" font-size="9.5">285 Web Audio Synths</text>

      <rect x="158" y="92" width="148" height="38" rx="8" fill="#111625" />
      <text x="168" y="109" fill="#2DD4BF" font-weight="700">/studio/engines</text>
      <text x="168" y="123" fill="#94A3B8" font-size="9.5">18 Shaders + RTL Audit</text>

      <rect x="0" y="138" width="306" height="48" rx="8" fill="#141829" stroke="#312E81" />
      <text x="12" y="157" fill="#C4B5FD" font-weight="700">/studio/ai · /dashboard · / (Scroll Cinema)</text>
      <text x="12" y="174" fill="#94A3B8" font-size="9.5">QLoRA Fine-Tuning Lab + 6-Act Entrance Film + Telemetry Deck</text>
    </g>
  </g>
</svg>
