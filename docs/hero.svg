  <rect x="830" y="330" width="152" height="74" rx="14" fill="url(#card-surface)" stroke="#232634" stroke-width="1" />
  <line x1="850" y1="330" x2="962" y2="330" stroke="#5EEAD4" stroke-width="2" stroke-opacity="0.7" />
