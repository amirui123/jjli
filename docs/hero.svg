<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%" role="img" aria-label="آزمایشگاه موشن فارسی — RTL Motion Lab">
  <defs>
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060A" />
      <stop offset="50%" stop-color="#090B12" />
      <stop offset="100%" stop-color="#06070B" />
    </linearGradient>

    <radialGradient id="glow-amber" cx="78%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#E8B33A" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#E8B33A" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#E8B33A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan" cx="22%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#22D3EE" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-violet" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="border-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B33A" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#232634" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#232634" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="card-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11141E" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0B0D14" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#E8B33A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#22D3EE" />
